name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This makes one harmless read every
# 3 days with the public publishable key (the keepalive() function just returns true; no data).
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          URL: https://ocliypdvdtiyucthykiu.supabase.co
          KEY: sb_publishable_EDj2LfCZpyFHm2D8iEkZEA_1Z6Md-us
        run: |
          code=$(curl -s -o out.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat out.txt)"
          test "$code" = "200"
